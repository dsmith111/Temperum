[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-model"
version = "0.2.0.dev0"
description = "Convert Hugging Face models into NPU-ready bundles for the Ollama NPU fork."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dsmith111" }]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "huggingface_hub>=0.30",
  # Structural bundle inspection parses ONNX graphs (metadata only).
  "onnx>=1.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[project.scripts]
npu-model = "npu_model.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["spike"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# Heavy toolchain packages live in separate role environments, not in the CLI's own
# environment; scripts that run inside those environments import them dynamically.
[[tool.mypy.overrides]]
module = [
  "numpy", "numpy.*",
  "onnx", "onnx.*",
  "onnxruntime", "onnxruntime.*",
  "onnxruntime_genai", "onnxruntime_genai.*",
  "olive", "olive.*",
  "transformers", "transformers.*",
  "torch", "torch.*",
  "google.protobuf", "google.protobuf.*",
  "huggingface_hub", "huggingface_hub.*",
]
ignore_missing_imports = true
follow_imports = "skip"
